<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px; color: #1e1e1e; background: #fff;
      height: 540px; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 16px; border-bottom: 1px solid #e5e5e5; flex-shrink: 0;
    }
    .header-title { font-weight: 600; font-size: 13px; }
    .record-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #d0d0d0; flex-shrink: 0; transition: background 0.3s;
    }
    .record-dot.active { background: #f24822; animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ── Section ── */
    .section { padding: 10px 16px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; }
    .section-label {
      font-size: 10px; font-weight: 600; color: #999;
      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px;
    }

    /* ── Input ── */
    .input-row { display: flex; gap: 6px; align-items: center; }
    input[type="text"] {
      flex: 1; height: 28px; padding: 0 8px;
      border: 1px solid #e5e5e5; border-radius: 4px;
      font-size: 11px; font-family: inherit; color: #1e1e1e;
      background: #fafafa; outline: none; transition: border-color .15s, background .15s;
    }
    input[type="text"]:focus  { border-color: #0c8ce9; background: #fff; }
    input[type="text"]:disabled { opacity: .45; cursor: not-allowed; }
    .hint { font-size: 10px; color: #bbb; margin-top: 5px; }

    /* ── Button ── */
    .btn {
      height: 28px; padding: 0 10px; border: none; border-radius: 4px;
      font-size: 11px; font-family: inherit; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: opacity .15s;
    }
    .btn:hover:not(:disabled)  { opacity: .82; }
    .btn:active:not(:disabled) { opacity: .65; }
    .btn:disabled { opacity: .38; cursor: not-allowed; }
    .btn-secondary { background: #f0f0f0; color: #1e1e1e; }
    .btn-primary   { background: #0c8ce9; color: #fff; }
    .btn-danger    { background: #f24822; color: #fff; }

    /* ── Connection status ── */
    .conn-status { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #d0d0d0; flex-shrink: 0;
    }
    .status-dot.connected    { background: #14ae5c; }
    .status-dot.disconnected { background: #f24822; }
    .status-label { font-size: 10px; color: #999; }

    /* ── Control ── */
    .control-section { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; }
    .btn-record { width: 100%; height: 36px; font-size: 13px; font-weight: 600; border-radius: 6px; }
    .record-status { text-align: center; font-size: 10px; color: #aaa; margin-top: 7px; min-height: 14px; }

    /* ── Activity log ── */
    .log-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 16px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0;
    }
    .log-header-title {
      font-size: 10px; font-weight: 600; color: #999;
      text-transform: uppercase; letter-spacing: .5px;
    }
    .log-count { font-size: 10px; color: #bbb; }
    .log-entries { flex: 1; overflow-y: auto; padding: 4px 16px 8px; }
    .log-entry {
      padding: 3px 0; font-size: 10px;
      font-family: 'Consolas','Menlo','Monaco',monospace;
      line-height: 1.5; border-bottom: 1px solid #f8f8f8; word-break: break-all;
    }
    .log-entry.create { color: #14ae5c; }
    .log-entry.delete { color: #f24822; }
    .log-entry.change { color: #0c8ce9; }
    .log-entry.system { color: #aaa; font-style: italic; }
    .log-entry.error  { color: #f24822; font-style: italic; }
    .log-empty { text-align: center; color: #ccc; font-size: 11px; padding: 28px 0; }
  </style>
</head>
<body>

  <div class="header">
    <div class="record-dot" id="recordDot"></div>
    <div class="header-title">Work Logger</div>
  </div>

  <div class="section">
    <div class="section-label">서버 설정</div>
    <div class="input-row">
      <input type="text" id="serverUrl" placeholder="http://localhost:3000" />
      <button class="btn btn-secondary" id="btnTest">연결 테스트</button>
      <div class="conn-status">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-label" id="statusLabel">-</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">저장 경로</div>
    <div class="input-row">
      <input type="text" id="filePath" placeholder="C:\Users\user\work-log.txt" />
    </div>
    <div class="hint">파일이 없으면 자동 생성됩니다 (상위 폴더는 존재해야 합니다)</div>
  </div>

  <div class="control-section">
    <button class="btn btn-primary btn-record" id="btnRecord">&#9654;  기록 시작</button>
    <div class="record-status" id="recordStatus">서버를 실행하고 저장 경로를 입력하세요</div>
  </div>

  <div class="log-section">
    <div class="log-header">
      <div class="log-header-title">최근 활동</div>
      <span class="log-count" id="logCount">0개</span>
    </div>
    <div class="log-entries" id="logEntries">
      <div class="log-empty">기록을 시작하면 활동이 여기에 표시됩니다</div>
    </div>
  </div>

  <script>
    var MAX_ENTRIES  = 100;
    var isRecording  = false;
    var entryCount   = 0;
    // 동시 쓰기 방지 큐
    var writeQueue   = Promise.resolve();

    var recordDot      = document.getElementById('recordDot');
    var btnRecord      = document.getElementById('btnRecord');
    var btnTest        = document.getElementById('btnTest');
    var statusDot      = document.getElementById('statusDot');
    var statusLabel    = document.getElementById('statusLabel');
    var recordStatus   = document.getElementById('recordStatus');
    var logEntriesEl   = document.getElementById('logEntries');
    var logCountEl     = document.getElementById('logCount');
    var serverUrlInput = document.getElementById('serverUrl');
    var filePathInput  = document.getElementById('filePath');

    function setConnectionStatus(connected) {
      statusDot.className     = 'status-dot ' + (connected ? 'connected' : 'disconnected');
      statusLabel.textContent = connected ? '연결됨' : '연결 실패';
    }

    function setRecording(recording) {
      isRecording = recording;
      recordDot.className = 'record-dot' + (recording ? ' active' : '');
      if (recording) {
        btnRecord.textContent    = '■  기록 중지';
        btnRecord.className      = 'btn btn-danger btn-record';
        recordStatus.textContent = '기록 중...';
        serverUrlInput.disabled  = true;
        filePathInput.disabled   = true;
        btnTest.disabled         = true;
      } else {
        btnRecord.textContent    = '▶  기록 시작';
        btnRecord.className      = 'btn btn-primary btn-record';
        recordStatus.textContent = '기록 중지됨 — 파일에 저장되었습니다';
        serverUrlInput.disabled  = false;
        filePathInput.disabled   = false;
        btnTest.disabled         = false;
      }
    }

    function getEntryClass(text) {
      if (text.indexOf('[생성]') >= 0 || text.indexOf('[스타일 생성]') >= 0) return 'create';
      if (text.indexOf('[삭제]') >= 0 || text.indexOf('[스타일 삭제]') >= 0) return 'delete';
      if (text.indexOf('[변경]') >= 0 || text.indexOf('[스타일 변경]') >= 0) return 'change';
      return 'system';
    }

    function addLogEntry(text, cls) {
      var empty = logEntriesEl.querySelector('.log-empty');
      if (empty) empty.remove();
      var el = document.createElement('div');
      el.className   = 'log-entry ' + cls;
      el.textContent = text.length > 110 ? text.slice(0, 107) + '…' : text;
      el.title       = text;
      logEntriesEl.insertBefore(el, logEntriesEl.firstChild);
      entryCount++;
      logCountEl.textContent = entryCount + '개';
      if (logEntriesEl.children.length > MAX_ENTRIES) {
        logEntriesEl.removeChild(logEntriesEl.lastChild);
      }
    }

    // UI가 직접 서버에 fetch (Figma 샌드박스는 localhost fetch 불가)
    function sendLog(entry) {
      writeQueue = writeQueue.then(function() { return doSend(entry); });
    }

    async function doSend(entry) {
      var url  = serverUrlInput.value.trim();
      var path = filePathInput.value.trim();
      if (!url || !path) return;
      try {
        var res = await fetch(url + '/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ entry: entry, filePath: path }),
        });
        if (res.ok) {
          addLogEntry(entry, getEntryClass(entry));
        } else {
          var errText = await res.text();
          addLogEntry('서버 오류: ' + errText, 'error');
          if (isRecording) recordStatus.textContent = '⚠ 서버 오류: ' + errText;
        }
      } catch (e) {
        addLogEntry('서버 연결 실패', 'error');
        if (isRecording) recordStatus.textContent = '⚠ 서버 연결 실패 — 서버가 실행 중인지 확인하세요';
      }
    }

    // 연결 테스트 — UI에서 직접 fetch
    btnTest.addEventListener('click', async function() {
      var url = serverUrlInput.value.trim();
      if (!url) return;
      statusLabel.textContent = '확인 중…';
      statusDot.className = 'status-dot';
      try {
        var res = await fetch(url + '/health');
        setConnectionStatus(res.ok);
      } catch (e) {
        setConnectionStatus(false);
      }
    });

    btnRecord.addEventListener('click', function() {
      if (!isRecording) {
        var url  = serverUrlInput.value.trim();
        var path = filePathInput.value.trim();
        if (!url || !path) {
          recordStatus.textContent = '⚠ 서버 URL과 저장 경로를 모두 입력하세요';
          return;
        }
        parent.postMessage({
          pluginMessage: { type: 'start-recording', serverUrl: url, filePath: path }
        }, '*');
      } else {
        parent.postMessage({ pluginMessage: { type: 'stop-recording' } }, '*');
      }
    });

    window.onmessage = function(event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;
      switch (msg.type) {
        case 'init-settings':
          serverUrlInput.value = msg.serverUrl || 'http://localhost:3000';
          filePathInput.value  = msg.filePath  || '';
          break;
        case 'recording-started':
          setRecording(true);
          break;
        case 'recording-stopped':
          setRecording(false);
          break;
        case 'send-log':
          sendLog(msg.entry);
          break;
      }
    };
  </script>
</body>
</html>
