<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      color: #1e1e1e;
      background: #fff;
      height: 540px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      border-bottom: 1px solid #e5e5e5;
      flex-shrink: 0;
    }
    .header-title {
      font-weight: 600;
      font-size: 13px;
    }
    .record-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d0d0d0;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .record-dot.active {
      background: #f24822;
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.25; }
    }

    /* ── Section ── */
    .section {
      padding: 10px 16px;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0;
    }
    .section-label {
      font-size: 10px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    /* ── Input ── */
    .input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    input[type="text"] {
      flex: 1;
      height: 28px;
      padding: 0 8px;
      border: 1px solid #e5e5e5;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      color: #1e1e1e;
      background: #fafafa;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    input[type="text"]:focus {
      border-color: #0c8ce9;
      background: #fff;
    }
    input[type="text"]:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .hint {
      font-size: 10px;
      color: #bbb;
      margin-top: 5px;
    }

    /* ── Button ── */
    .btn {
      height: 28px;
      padding: 0 10px;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .btn:hover:not(:disabled)  { opacity: 0.82; }
    .btn:active:not(:disabled) { opacity: 0.65; }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .btn-secondary { background: #f0f0f0; color: #1e1e1e; }
    .btn-primary   { background: #0c8ce9; color: #fff; }
    .btn-danger    { background: #f24822; color: #fff; }

    /* ── Connection status ── */
    .conn-status {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d0d0d0;
      flex-shrink: 0;
    }
    .status-dot.connected    { background: #14ae5c; }
    .status-dot.disconnected { background: #f24822; }
    .status-label {
      font-size: 10px;
      color: #999;
    }

    /* ── Control section ── */
    .control-section {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0;
    }
    .btn-record {
      width: 100%;
      height: 36px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
    }
    .record-status {
      text-align: center;
      font-size: 10px;
      color: #aaa;
      margin-top: 7px;
      min-height: 14px;
    }

    /* ── Activity log ── */
    .log-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 16px;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0;
    }
    .log-header-title {
      font-size: 10px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .log-count { font-size: 10px; color: #bbb; }

    .log-entries {
      flex: 1;
      overflow-y: auto;
      padding: 4px 16px 8px;
    }
    .log-entry {
      padding: 3px 0;
      font-size: 10px;
      font-family: 'Consolas', 'Menlo', 'Monaco', monospace;
      line-height: 1.5;
      border-bottom: 1px solid #f8f8f8;
      word-break: break-all;
      cursor: default;
    }
    .log-entry.create { color: #14ae5c; }
    .log-entry.delete { color: #f24822; }
    .log-entry.change { color: #0c8ce9; }
    .log-entry.style  { color: #9747ff; }
    .log-entry.system { color: #aaa; font-style: italic; }
    .log-entry.error  { color: #f24822; font-style: italic; }

    .log-empty {
      text-align: center;
      color: #ccc;
      font-size: 11px;
      padding: 28px 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="record-dot" id="recordDot"></div>
    <div class="header-title">Work Logger</div>
  </div>

  <!-- Server settings -->
  <div class="section">
    <div class="section-label">서버 설정</div>
    <div class="input-row">
      <input type="text" id="serverUrl" placeholder="http://localhost:3000" />
      <button class="btn btn-secondary" id="btnTest">연결 테스트</button>
      <div class="conn-status">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-label" id="statusLabel">-</span>
      </div>
    </div>
  </div>

  <!-- File path -->
  <div class="section">
    <div class="section-label">저장 경로</div>
    <div class="input-row">
      <input type="text" id="filePath" placeholder="C:\Users\user\work-log.txt" />
    </div>
    <div class="hint">파일이 없으면 자동 생성됩니다 (상위 폴더는 존재해야 합니다)</div>
  </div>

  <!-- Recording control -->
  <div class="control-section">
    <button class="btn btn-primary btn-record" id="btnRecord">▶  기록 시작</button>
    <div class="record-status" id="recordStatus">서버를 실행하고 저장 경로를 입력하세요</div>
  </div>

  <!-- Activity log -->
  <div class="log-section">
    <div class="log-header">
      <div class="log-header-title">최근 활동</div>
      <span class="log-count" id="logCount">0개</span>
    </div>
    <div class="log-entries" id="logEntries">
      <div class="log-empty">기록을 시작하면 활동이 여기에 표시됩니다</div>
    </div>
  </div>

  <script>
    const MAX_ENTRIES = 100;

    let isRecording = false;
    let entryCount  = 0;

    const recordDot   = document.getElementById('recordDot');
    const btnRecord   = document.getElementById('btnRecord');
    const btnTest     = document.getElementById('btnTest');
    const statusDot   = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const recordStatus = document.getElementById('recordStatus');
    const logEntriesEl = document.getElementById('logEntries');
    const logCountEl   = document.getElementById('logCount');
    const serverUrlInput = document.getElementById('serverUrl');
    const filePathInput  = document.getElementById('filePath');

    function setConnectionStatus(connected) {
      statusDot.className   = 'status-dot ' + (connected ? 'connected' : 'disconnected');
      statusLabel.textContent = connected ? '연결됨' : '연결 실패';
    }

    function setRecording(recording) {
      isRecording = recording;
      recordDot.className = 'record-dot' + (recording ? ' active' : '');

      if (recording) {
        btnRecord.textContent = '■  기록 중지';
        btnRecord.className   = 'btn btn-danger btn-record';
        recordStatus.textContent = '기록 중...';
        serverUrlInput.disabled = true;
        filePathInput.disabled  = true;
        btnTest.disabled = true;
      } else {
        btnRecord.textContent = '▶  기록 시작';
        btnRecord.className   = 'btn btn-primary btn-record';
        recordStatus.textContent = '기록 중지됨 — 파일에 저장되었습니다';
        serverUrlInput.disabled = false;
        filePathInput.disabled  = false;
        btnTest.disabled = false;
      }
    }

    function getEntryClass(text) {
      if (text.includes('[생성]') || text.includes('[스타일 생성]')) return 'create';
      if (text.includes('[삭제]') || text.includes('[스타일 삭제]')) return 'delete';
      if (text.includes('[변경]') || text.includes('[스타일 변경]')) return 'change';
      if (text.includes('기록 시작') || text.includes('기록 종료'))  return 'system';
      return 'system';
    }

    function addLogEntry(text, cls) {
      const empty = logEntriesEl.querySelector('.log-empty');
      if (empty) empty.remove();

      const el = document.createElement('div');
      el.className = 'log-entry ' + cls;
      el.textContent = text.length > 110 ? text.slice(0, 107) + '…' : text;
      el.title = text;
      logEntriesEl.insertBefore(el, logEntriesEl.firstChild);

      entryCount++;
      logCountEl.textContent = entryCount + '개';

      // 최대치 초과 시 마지막 항목 제거
      if (logEntriesEl.children.length > MAX_ENTRIES) {
        logEntriesEl.removeChild(logEntriesEl.lastChild);
      }
    }

    // 연결 테스트
    btnTest.addEventListener('click', () => {
      const url = serverUrlInput.value.trim();
      if (!url) return;
      statusLabel.textContent = '확인 중…';
      statusDot.className = 'status-dot';
      parent.postMessage({ pluginMessage: { type: 'check-connection', serverUrl: url } }, '*');
    });

    // 기록 시작 / 중지
    btnRecord.addEventListener('click', () => {
      if (!isRecording) {
        const url  = serverUrlInput.value.trim();
        const path = filePathInput.value.trim();
        if (!url || !path) {
          recordStatus.textContent = '⚠ 서버 URL과 저장 경로를 모두 입력하세요';
          return;
        }
        parent.postMessage({
          pluginMessage: { type: 'start-recording', serverUrl: url, filePath: path },
        }, '*');
      } else {
        parent.postMessage({ pluginMessage: { type: 'stop-recording' } }, '*');
      }
    });

    // 플러그인 코드에서 오는 메시지 수신
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      switch (msg.type) {
        case 'init-settings':
          serverUrlInput.value = msg.serverUrl || 'http://localhost:3000';
          filePathInput.value  = msg.filePath  || '';
          break;

        case 'connection-status':
          setConnectionStatus(msg.connected);
          break;

        case 'recording-started':
          setRecording(true);
          break;

        case 'recording-stopped':
          setRecording(false);
          break;

        case 'log-success':
          addLogEntry(msg.entry, getEntryClass(msg.entry));
          break;

        case 'log-error':
          addLogEntry('오류: ' + msg.message, 'error');
          recordStatus.textContent = '⚠ ' + msg.message;
          break;
      }
    };
  </script>
</body>
</html>
