<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      color: #1e1e1e;
      background: #fff;
      height: 460px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 16px; border-bottom: 1px solid #e5e5e5; flex-shrink: 0;
    }
    .header-title { font-weight: 600; font-size: 13px; }
    .record-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #d0d0d0; flex-shrink: 0; transition: background 0.3s;
    }
    .record-dot.active { background: #f24822; animation: pulse 1.4s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.25; }
    }

    /* ── Compatibility banner ── */
    .compat-banner {
      display: none;
      background: #fff3cd; border-bottom: 1px solid #ffc107;
      padding: 8px 16px; font-size: 11px; color: #856404; flex-shrink: 0;
    }
    .compat-banner.show { display: block; }

    /* ── Section ── */
    .section {
      padding: 10px 16px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0;
    }
    .section-label {
      font-size: 10px; font-weight: 600; color: #999;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
    }
    .file-row { display: flex; gap: 8px; align-items: center; }
    .file-name {
      flex: 1; font-size: 11px; color: #555;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .file-name.empty { color: #bbb; }
    .hint { font-size: 10px; color: #bbb; margin-top: 5px; }

    /* ── Button ── */
    .btn {
      height: 28px; padding: 0 10px; border: none; border-radius: 4px;
      font-size: 11px; font-family: inherit; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: opacity 0.15s; flex-shrink: 0;
    }
    .btn:hover:not(:disabled)  { opacity: 0.82; }
    .btn:active:not(:disabled) { opacity: 0.65; }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .btn-secondary { background: #f0f0f0; color: #1e1e1e; }
    .btn-primary   { background: #0c8ce9; color: #fff; }
    .btn-danger    { background: #f24822; color: #fff; }

    /* ── Control section ── */
    .control-section {
      padding: 12px 16px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0;
    }
    .btn-record {
      width: 100%; height: 36px;
      font-size: 13px; font-weight: 600; border-radius: 6px;
    }
    .record-status {
      text-align: center; font-size: 10px; color: #aaa;
      margin-top: 7px; min-height: 14px;
    }

    /* ── Activity log ── */
    .log-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 16px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0;
    }
    .log-header-title {
      font-size: 10px; font-weight: 600; color: #999;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .log-count { font-size: 10px; color: #bbb; }

    .log-entries { flex: 1; overflow-y: auto; padding: 4px 16px 8px; }
    .log-entry {
      padding: 3px 0; font-size: 10px;
      font-family: 'Consolas', 'Menlo', 'Monaco', monospace;
      line-height: 1.5; border-bottom: 1px solid #f8f8f8;
      word-break: break-all; cursor: default;
    }
    .log-entry.create { color: #14ae5c; }
    .log-entry.delete { color: #f24822; }
    .log-entry.change { color: #0c8ce9; }
    .log-entry.system { color: #aaa; font-style: italic; }
    .log-entry.error  { color: #f24822; font-style: italic; }

    .log-empty { text-align: center; color: #ccc; font-size: 11px; padding: 28px 0; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="record-dot" id="recordDot"></div>
    <div class="header-title">Work Logger</div>
  </div>

  <!-- 호환성 경고 (FSAA 미지원 환경) -->
  <div class="compat-banner" id="compatBanner">
    ⚠ 이 환경에서는 파일 직접 쓰기를 지원하지 않습니다 (File System Access API 없음)
  </div>

  <!-- File selection -->
  <div class="section">
    <div class="section-label">저장 파일</div>
    <div class="file-row">
      <button class="btn btn-secondary" id="btnSelectFile">파일 선택</button>
      <span class="file-name empty" id="fileName">선택된 파일 없음</span>
    </div>
    <div class="hint">파일이 없으면 새로 생성됩니다</div>
  </div>

  <!-- Recording control -->
  <div class="control-section">
    <button class="btn btn-primary btn-record" id="btnRecord" disabled>&#9654;  기록 시작</button>
    <div class="record-status" id="recordStatus">저장 파일을 선택하세요</div>
  </div>

  <!-- Activity log -->
  <div class="log-section">
    <div class="log-header">
      <div class="log-header-title">최근 활동</div>
      <span class="log-count" id="logCount">0개</span>
    </div>
    <div class="log-entries" id="logEntries">
      <div class="log-empty">기록을 시작하면 활동이 여기에 표시됩니다</div>
    </div>
  </div>

  <script>
    const MAX_ENTRIES = 100;

    let fileHandle   = null;
    let isRecording  = false;
    let entryCount   = 0;
    // 동시 쓰기 방지: 순차 처리 큐
    let writeQueue   = Promise.resolve();

    const recordDot    = document.getElementById('recordDot');
    const btnRecord    = document.getElementById('btnRecord');
    const btnSelectFile = document.getElementById('btnSelectFile');
    const fileName     = document.getElementById('fileName');
    const recordStatus = document.getElementById('recordStatus');
    const logEntriesEl = document.getElementById('logEntries');
    const logCountEl   = document.getElementById('logCount');
    const compatBanner = document.getElementById('compatBanner');

    // ── FSAA 지원 여부 확인 ──────────────────────────
    if (!('showSaveFilePicker' in window)) {
      compatBanner.classList.add('show');
      btnSelectFile.disabled = true;
    }

    // ── 파일 선택 ────────────────────────────────────
    btnSelectFile.addEventListener('click', async function () {
      try {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'work-log.txt',
          types: [{
            description: '텍스트 파일',
            accept: { 'text/plain': ['.txt'] }
          }]
        });
        fileName.textContent = fileHandle.name;
        fileName.classList.remove('empty');
        btnRecord.disabled = false;
        recordStatus.textContent = '기록을 시작하세요';
      } catch (e) {
        if (e.name !== 'AbortError') {
          recordStatus.textContent = '파일 선택 실패: ' + e.message;
        }
      }
    });

    // ── 기록 시작 / 중지 ─────────────────────────────
    btnRecord.addEventListener('click', function () {
      if (!isRecording) {
        parent.postMessage({ pluginMessage: { type: 'start-recording' } }, '*');
      } else {
        parent.postMessage({ pluginMessage: { type: 'stop-recording' } }, '*');
      }
    });

    // ── UI 상태 전환 ─────────────────────────────────
    function setRecording(recording) {
      isRecording = recording;
      recordDot.className = 'record-dot' + (recording ? ' active' : '');
      if (recording) {
        btnRecord.textContent  = '■  기록 중지';
        btnRecord.className    = 'btn btn-danger btn-record';
        recordStatus.textContent = '기록 중...';
        btnSelectFile.disabled = true;
      } else {
        btnRecord.textContent  = '▶  기록 시작';
        btnRecord.className    = 'btn btn-primary btn-record';
        recordStatus.textContent = '기록 중지됨 — 파일에 저장되었습니다';
        btnSelectFile.disabled = false;
      }
    }

    function getEntryClass(text) {
      if (text.includes('[생성]') || text.includes('[스타일 생성]')) return 'create';
      if (text.includes('[삭제]') || text.includes('[스타일 삭제]')) return 'delete';
      if (text.includes('[변경]') || text.includes('[스타일 변경]')) return 'change';
      return 'system';
    }

    function addLogEntry(text, cls) {
      var empty = logEntriesEl.querySelector('.log-empty');
      if (empty) empty.remove();

      var el = document.createElement('div');
      el.className   = 'log-entry ' + cls;
      el.textContent = text.length > 110 ? text.slice(0, 107) + '…' : text;
      el.title       = text;
      logEntriesEl.insertBefore(el, logEntriesEl.firstChild);

      entryCount++;
      logCountEl.textContent = entryCount + '개';
      if (logEntriesEl.children.length > MAX_ENTRIES) {
        logEntriesEl.removeChild(logEntriesEl.lastChild);
      }
    }

    // ── 파일 쓰기 (FSAA) — 순차 큐로 동시 접근 방지 ──
    function sendLog(entry) {
      writeQueue = writeQueue.then(function () {
        return doWrite(entry);
      });
    }

    async function doWrite(entry) {
      if (!fileHandle) return;
      try {
        var file     = await fileHandle.getFile();
        var writable = await fileHandle.createWritable({ keepExistingData: true });
        await writable.seek(file.size);      // 파일 끝으로 이동 (append)
        await writable.write(entry + '\n');
        await writable.close();
        addLogEntry(entry, getEntryClass(entry));
      } catch (e) {
        addLogEntry('파일 쓰기 실패: ' + e.message, 'error');
        recordStatus.textContent = '⚠ 파일 쓰기 실패: ' + e.message;
      }
    }

    // ── code.ts 메시지 수신 ──────────────────────────
    window.onmessage = function (event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;
      switch (msg.type) {
        case 'recording-started':
          setRecording(true);
          break;
        case 'recording-stopped':
          setRecording(false);
          break;
        case 'send-log':
          sendLog(msg.entry);
          break;
      }
    };
  </script>
</body>
</html>
